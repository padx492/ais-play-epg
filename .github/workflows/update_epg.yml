name: Update EPG Daily

on:
  schedule:
    - cron: '0 0 * * *' # รันทุกๆ เที่ยงคืน
  workflow_dispatch: # ปุ่มสำหรับกดรันด้วยมือ

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04 # ใช้ระบบปฏิบัติการเวอร์ชันเสถียร
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # อัปเดตเป็น v5 รองรับ Node.js 24+

      - name: Set up Node.js
        uses: actions/setup-node@v5 # อัปเดตเป็น v5
        with:
          node-version: '22' # กำหนดเวอร์ชัน Node.js ให้เสถียร

      - name: Install dependencies
        run: npm install

      - name: Run EPG generator script
        run: node index.js

      - name: Commit and push generated epg.xml
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add epg.xml
          git commit -m "Auto-update EPG XML" || exit 0
          git push
