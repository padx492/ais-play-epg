name: Update EPG Daily

on:
  schedule:
    - cron: '0 0 * * *' # รันทุกๆ เที่ยงคืน
  workflow_dispatch: # ปุ่มกดรันมือ

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # อัปเดตเป็น v5

      - name: Set up Node.js
        uses: actions/setup-node@v5 # อัปเดตเป็น v5
        with:
          node-version: '22' # เปลี่ยนมาใช้ Node.js 22 (หรือ 24)

      - name: Install dependencies
        run: npm install

      - name: Run EPG generator script
        run: node index.js

      - name: Commit and push generated epg.xml
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add epg.xml
          git commit -m "Auto-update EPG XML" || exit 0
          git push
